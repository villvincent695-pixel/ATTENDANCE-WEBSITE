<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Information</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #17252A;
      --teal: #2B7A78;
      --mint: #3AAFA9;
      --pale: #DEF2F1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Lato', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 20%, #3AAFA9 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, #17252A 0%, transparent 55%),
        linear-gradient(135deg, #2B7A78, #1d5654);
      background-attachment: fixed;
    }

    /* QR-style dot grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(222, 242, 241, 0.28) 2px, transparent 2.5px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(circle at center, transparent 20%, #000 90%);
      mask-image: radial-gradient(circle at center, transparent 20%, #000 90%);
      pointer-events: none;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .blob.one { width: 260px; height: 260px; background: #DEF2F1; top: -60px; right: -40px; }
    .blob.two { width: 300px; height: 300px; background: #3AAFA9; bottom: -90px; left: -70px; animation-delay: -6s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 40px) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 36px 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--deep);
    }

    .line {
      width: 60px;
      height: 4px;
      margin: 0 auto 20px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--teal), var(--mint));
    }

    .description {
      margin: 0 0 28px;
      text-align: center;
      font-size: clamp(15px, 2.5vw, 17px);
      line-height: 1.7;
      color: #24605e;
    }

    .contact-card {
      margin-bottom: 16px;
      padding: 18px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f3fbfa, #e4f4f3);
      border-left: 6px solid var(--teal);
    }

    .name {
      margin-bottom: 4px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--deep);
    }

    .number {
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: var(--teal);
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 14px;
      color: #6b8a89;
    }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
    }
  </style>
</head>

<body>
  <div class="blob one"></div>
  <div class="blob two"></div>

  <div class="container">
    <h1>Contact Us</h1>
    <div class="line"></div>
    <p class="description">
      If you encounter any problems or have concerns about this website,
      please feel free to message or contact any of the numbers below.
    </p>

    <div class="contact-card">
      <div class="name">Jhelamae Derigay</div>
      <div class="number">0930 360 7934</div>
    </div>

    <div class="contact-card">
      <div class="name">Vincent T. Cajes</div>
      <div class="number">0955 643 9483</div>
    </div>

    <div class="footer">© 2026 | Website Support Team</div>
  </div>
</body>
</html>
