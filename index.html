<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Homepage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: courier;
  min-height: 100vh;
  background-color: #1b2a6b;
  background-image: url(THS-Attendance.jpg);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #2c3e50, #1f2d3a);
  color: white;
  padding: 40px 20px 30px;
  text-align: center;
  border-bottom: 4px solid #3AAFA9;
}

header h1 {
  margin: 0;
  font-size: clamp(2rem, 9vw, 3rem);
  letter-spacing: 2px;
}

header p {
  margin: 10px 0 0;
  font-size: clamp(0.95rem, 3.6vw, 1.2rem);
  color: #DEF2F1;
  letter-spacing: 1px;
}

/* NAV */
nav {
  background-color: white;
  padding: 14px 10px;
  display: flex;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

nav a {
  padding: 10px 20px;
  border-radius: 999px;
  color: black;
  text-decoration: none;
  font-weight: bold;
  font-size: 1.05rem;
}

nav a:hover {
  background-color: #DEF2F1;
}

nav a.active {
  background-color: #3AAFA9;
  color: white;
}

.login-section {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
}

.login-box {
  background: #3AAFA9;
  width: 100%;
  max-width: 350px;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
  text-align: center;
}

.login-box h2 {
  margin-bottom: 15px;
}

.login-box input {
  width: 92%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.login-box button {
  width:100%;
  padding: 12px;
  background-color: blue;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

.login-box button:hover {
  background-color: white;
}

/* LOGIN MESSAGE */
#message {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
}

#message.success {
  display: block;
  background: #d4f7df;
  color: #14632e;
}

#message.error {
  display: block;
  background: #fde2e2;
  color: #9b1c1c;
}

</style>
</head>

<body>

<header>
  <h1>THS Annex</h1>
  <p>Web-Based Automated Attendance System</p>
</header>

<nav>
  <a href="about.html">About</a>
  <a href="index.html" class="active">Home</a>
  <a href="Contact.html">Contact</a>
</nav>

<div class="login-section">
  <div class="login-box">
    <h1>Login</h1>

    <form onsubmit="return login()" novalidate>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button type="submit">Login</button>
    </form>

    <div id="message" role="alert"></div>

  </div>
</div>

<footer>
</footer>

<script>
function showError(text, field) {
  var message = document.getElementById("message");
  message.className = "error";
  message.textContent = text;
  if (field) field.focus();
}

function login() {
  var userInput = document.getElementById("username");
  var passInput = document.getElementById("password");
  var message = document.getElementById("message");
  var user = userInput.value.trim();
  var pass = passInput.value;

  if (user === "" && pass === "") {
    showError("Please enter your username and password.", userInput);
  } else if (user === "") {
    showError("Please enter your username.", userInput);
  } else if (pass === "") {
    showError("Please enter your password.", passInput);
  } else if (user !== "TSHS") {
    showError("Username not found. Please check and try again.", userInput);
  } else if (pass !== "1234") {
    showError("Wrong password. Please try again.", passInput);
    passInput.value = "";
  } else {
    message.className = "success";
    message.textContent = "Login successful! Redirecting...";
    setTimeout(function () {
      window.location.href = "ccc.html";
    }, 1200);
  }

  return false;
}
</script>

</body>
</html>
