<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Attendance System</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Courier;
  background-image: url("logo5.jpg");
  margin: 0;
  text-align: center;
  background-size: 75vh;
}

#scanMessage { font-weight: bold; margin: 10px; font-size: 18px; }
.success { color: green; }
.error { color: red; }

#reader {
  width: 300px;
  margin: auto;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

table {
  margin: 20px auto;
  width: 90%;
  border-collapse: collapse;
  background: white;
}

th { background: #5482e6; color: white; padding: 10px; }
td { border: 1px solid #ddd; padding: 8px; }

.present { background: #2ECC71; color: #166534; font-weight: bold; }
.late { background: darkgoldenrod; color: yellow; font-weight: bold; }
.absent { background: #fecaca; color: #7f1d1d; font-weight: bold; }

button {
  padding: 10px 20px;
  background: green;
  color: white;
  border: none;
  border-radius: 5px;
  margin: 5px;
  cursor: pointer;
}

.logout {
  background: red;
}
</style>
</head>

<body>

<h2>QR Attendance System</h2>

<button onclick="setMode('in')">🟢 Time In</button>
<button onclick="setMode('out')">🔵 Time Out</button>

<h3 id="modeLabel">Mode: Time In</h3>
<div id="scanMessage"></div>
<div id="reader"></div>

<table id="attendanceTable">
<tr>
  <th>Student Name</th>
  <th>Date</th>
  <th>Time</th>
  <th>Status</th>
</tr>
</table>

<br>
<button onclick="exportToCSV()">⬇ Export to Excel</button>
<button onclick="markAllAbsent()">Mark Remaining as Absent</button>
<button class="logout" onclick="logout()">Logout</button>

<script>
let mode = "in"; // default Time In

function setMode(selectedMode){
  mode = selectedMode;
  document.getElementById("modeLabel").innerText =
    mode === "in" ? "Mode: Time In" : "Mode: Time Out";
}

let scanLocked = false;
let scanDelay = 6000;

// 🔊 BEEP
function beepSuccess(){
  let ctx=new (window.AudioContext||window.webkitAudioContext)();
  let o=ctx.createOscillator();
  o.frequency.value=900;o.connect(ctx.destination);o.start();
  setTimeout(()=>o.stop(),150);
}
function beepError(){
  let ctx=new (window.AudioContext||window.webkitAudioContext)();
  let o=ctx.createOscillator();
  o.frequency.value=300;o.connect(ctx.destination);o.start();
  setTimeout(()=>o.stop(),250);
}

// STATUS LOGIC
function getStatus(now){
  let presentCutoff=new Date(); presentCutoff.setHours(6,30,0,0);
  let absentCutoff=new Date(); absentCutoff.setHours(12,0,0,0);

  if(now<=presentCutoff) return "Present";
  if(now<absentCutoff) return "Late";
  return "Absent";
}

function onScanSuccess(decodedText){
  if(scanLocked)return;
  scanLocked=true;

  let table=document.getElementById("attendanceTable");
  let msg=document.getElementById("scanMessage");
  let student=students[decodedText];

  if(!student){
    msg.innerText="❌ Unknown QR";
    msg.className="error";
    beepError(); unlock(); return;
  }

  let name=student.name;
  let now=new Date();

  // CHECK kung existing na
  for(let i=1;i<table.rows.length;i++){
    if(table.rows[i].cells[0].innerText===name){

      // ✅ If Time Out → update time only
      if(mode==="out"){
        table.rows[i].cells[2].innerText = now.toLocaleTimeString();
        msg.innerText="⏰ Time Out Recorded: "+name;
        msg.className="success";
        beepSuccess(); unlock(); return;
      }

      msg.innerText="⚠ Already Time In: "+name;
      msg.className="error";
      beepError(); unlock(); return;
    }
  }

  // ✅ NEW TIME IN ENTRY
  if(mode==="in"){
    let status=getStatus(now);

    let row=table.insertRow();
    row.insertCell(0).innerText=name;
    row.insertCell(1).innerText=now.toLocaleDateString();
    row.insertCell(2).innerText=now.toLocaleTimeString();
    row.insertCell(3).innerText=status;
    row.cells[3].className=status.toLowerCase();

    msg.innerText="✅ "+name+" ("+status+")";
    msg.className="success";
    beepSuccess();
  }

  unlock();
}

function unlock(){setTimeout(()=>scanLocked=false,scanDelay);}
new Html5QrcodeScanner("reader",{fps:10,qrbox:250}).render(onScanSuccess);

// MARK ABSENT
function markAllAbsent(){
  let table=document.getElementById("attendanceTable");
  let scanned=[...table.rows].slice(1).map(r=>r.cells[0].innerText);
  let now=new Date();

  for(let id in students){
    let name=students[id].name;
    if(!scanned.includes(name)){
      let row=table.insertRow();
      row.insertCell(0).innerText=name;
      row.insertCell(1).innerText=now.toLocaleDateString();
      row.insertCell(2).innerText="-";
      row.insertCell(3).innerText="Absent";
      row.cells[3].className="absent";
    }
  }
}

// EXPORT
function exportToCSV(){
  let rows=[...document.querySelectorAll("#attendanceTable tr")];
  let csv=rows.map(r=>[...r.cells].map(c=>c.innerText).join(",")).join("\n");
  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Attendance.csv";
  a.click();
}

// LOGOUT
function logout(){
  if(confirm("Logout?")) window.location="index.html";
}
</script>
