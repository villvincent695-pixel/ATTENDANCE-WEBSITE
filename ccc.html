<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>QR Attendance System - Advanced</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  body {
    font-family: Courier;
    background-image: url("logo5.jpg");
    margin: 0;
    text-align: center;
    background-size: 75vh;
  }

  #scanMessage {
    font-weight: bold;
    margin: 10px;
    font-size: 18px;
  }
  .success { color: green; }
  .error { color: red; }

  #reader {
    width: 300px;
    margin: auto;
    background: white;
    padding: 10px;
    border-radius: 10px;
  }

  table {
    margin: 20px auto;
    width: 90%;
    border-collapse: collapse;
    background: white;
  }
  th {
    background: #5482e6;
    color: white;
    padding: 10px;
  }
  td {
    border: 1px solid #ddd;
    padding: 8px;
  }

  .present { background: #2ECC71; color: #166534; font-weight: bold; }
  .late { background: darkgoldenrod; color: yellow; font-weight: bold; }
  .absent { background: #fecaca; color: #7f1d1d; font-weight: bold; }

  button {
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
    margin: 5px;
    cursor: pointer;
  }
  .logout { background: red; }

  /* === UPDATED TIME IN / TIME OUT BUTTONS ONLY === */
  .inBtn, .outBtn {
    padding: 25px 25px;
    font-size: 20px;
    font-weight: 500;
    border: none;
    border-radius: 14px;
    margin: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    font-family: 'Segoe UI', Arial, sans-serif; /* mas readable lang sa buttons */
  }

  .inBtn { 
    background: #22c55e; /* bright green */
    color: #fff; 
    box-shadow: 0 0 20px rgba(34,197,94,0.8), 0 6px 15px rgba(0,0,0,0.3);
  }
  .inBtn:hover { 
    background: #16a34a; 
    transform: scale(1.08);
    box-shadow: 0 0 20px rgba(34,197,94,1), 0 8px 20px rgba(0,0,0,0.4);
  }

  .outBtn { 
    background: #3b82f6; /* bright blue */
    color: #fff; 
    box-shadow: 0 0 20px rgba(59,130,246,0.8), 0 6px 15px rgba(0,0,0,0.3);
  }
  .outBtn:hover { 
    background: #1d4ed8; 
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(59,130,246,1), 0 8px 20px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<h2>QR Attendance System (Advanced)</h2>
<button class="inBtn" onclick="setMode('in')">🟢 TIME IN</button>
<button class="outBtn" onclick="setMode('out')">🔵 TIME OUT</button>
<h3 id="modeLabel">Mode: Time In</h3>
<div id="scanMessage"></div>
<div id="reader"></div>

<table id="attendanceTable">
<tr>
  <th>Student Name</th>
  <th>Date</th>
  <th>Time In</th>
  <th>Time Out</th>
  <th>Status</th>
</tr>
</table>

<button onclick="markAllAbsent()">Mark Unscanned as Absent</button>
<button onclick="exportToCSV()">Export to Excel</button>
<button class="logout" onclick="logout()">Logout</button>

/* ======================= CONFIG ======================= */
let mode="in";
let scanLocked=false;
let scanDelay=5000;
const EXPIRY_HOURS = 24;
const EXPIRY_MS = EXPIRY_HOURS * 60 * 60 * 1000;

/* ======================= MODE ======================= */
function setMode(m){
  mode=m;
  document.getElementById("modeLabel").innerText = mode==="in" ? "Mode: Time In" : "Mode: Time Out";
}

/* ======================= SOUND ======================= */
function beep(freq,duration){
  let ctx=new(window.AudioContext||window.webkitAudioContext)();
  let o=ctx.createOscillator();
  o.frequency.value=freq;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),duration);
}
