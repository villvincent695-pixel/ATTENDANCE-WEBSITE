<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Attendance System - Advanced</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Courier;
  background-image: url("logo5.jpg");
  margin: 0;
  text-align: center;
  background-size: 75vh;
}

#scanMessage { font-weight: bold; margin: 10px; font-size: 18px; }
.success { color: green; }
.error { color: red; }

#reader {
  width: 300px;
  margin: auto;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

table {
  margin: 20px auto;
  width: 90%;
  border-collapse: collapse;
  background: white;
}

th { background: #5482e6; color: white; padding: 10px; }
td { border: 1px solid #ddd; padding: 8px; }

.present { background: #2ECC71; color: #166534; font-weight: bold; }
.late { background: darkgoldenrod; color: yellow; font-weight: bold; }
.absent { background: #fecaca; color: #7f1d1d; font-weight: bold; }

button {
  padding: 10px 20px;
  background: green;
  color: white;
  border: none;
  border-radius: 5px;
  margin: 5px;
  cursor: pointer;
}

.logout {
  background: red;
}
</style>
</head>

<body>

<h2>QR Attendance System (Advanced)</h2>

<button class="inBtn" onclick="setMode('in')">🟢 Time In</button>
<button class="outBtn" onclick="setMode('out')">🔵 Time Out</button>
<h3 id="modeLabel">Mode: Time In</h3>

<div id="scanMessage"></div>
<div id="reader"></div>

<table id="attendanceTable">
<tr>
  <th>Student Name</th>
  <th>Date</th>
  <th>Time In</th>
  <th>Time Out</th>
  <th>Status</th>
</tr>
</table>

<button onclick="markAllAbsent()">Mark Unscanned as Absent</button>
<button onclick="exportToCSV()">Export to Excel</button>
<button class="logout" onclick="logout()">Logout</button>

<script>
/* =======================
   CONFIG
======================= */
let mode="in";
let scanLocked=false;
let scanDelay=5000;

const EXPIRY_HOURS = 24;
const EXPIRY_MS = EXPIRY_HOURS * 60 * 60 * 1000;

/* =======================
   MODE
======================= */
function setMode(m){
  mode=m;
  document.getElementById("modeLabel").innerText =
    mode==="in" ? "Mode: Time In" : "Mode: Time Out";
}

/* =======================
   SOUND
======================= */
function beep(freq,duration){
  let ctx=new(window.AudioContext||window.webkitAudioContext)();
  let o=ctx.createOscillator();
  o.frequency.value=freq;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),duration);
}

/* =======================
   STUDENT LIST (UNCHANGED)
======================= */
const students = {

/* =======================
   STATUS LOGIC
======================= */
function getStatus(now){
  let presentCutoff=new Date();
  presentCutoff.setHours(6,30,0,0);
  let absentCutoff=new Date();
  absentCutoff.setHours(12,0,0,0);
  if(now<=presentCutoff)return "Present";
  if(now<absentCutoff)return "Late";
  return "Absent";
}

/* =======================
   SAVE / LOAD (24H EXPIRY)
======================= */
function saveAttendance(){
  localStorage.setItem(
    "attendance_data",
    document.getElementById("attendanceTable").innerHTML
  );
  if(!localStorage.getItem("attendance_time")){
    localStorage.setItem("attendance_time", Date.now());
  }
}

function loadAttendance(){
  let t = localStorage.getItem("attendance_time");
  if(t && Date.now()-t > EXPIRY_MS){
    localStorage.removeItem("attendance_data");
    localStorage.removeItem("attendance_time");
    return;
  }
  let data = localStorage.getItem("attendance_data");
  if(data){
    document.getElementById("attendanceTable").innerHTML = data;
  }
}

/* =======================
   SCAN LOGIC
======================= */
function onScanSuccess(decodedText){
  if(scanLocked) return;
  scanLocked=true;

  let msg=document.getElementById("scanMessage");
  let table=document.getElementById("attendanceTable");
  let student=students[decodedText];

  if(!student){
    msg.innerText="❌ Unknown QR";
    msg.className="error";
    beep(300,200);
    unlock(); return;
  }

  let name=student.name;
  let now=new Date();
  let dateStr=now.toLocaleDateString();
  let timeStr=now.toLocaleTimeString();

  for(let i=1;i<table.rows.length;i++){
    if(table.rows[i].cells[0].innerText===name){
      if(mode==="in"){
        msg.innerText="⚠ Already Timed In";
        beep(300,200);
        unlock(); return;
      }
      if(mode==="out"){
        if(table.rows[i].cells[3].innerText!==""){
          msg.innerText="⚠ Already Timed Out";
          beep(300,200);
          unlock(); return;
        }
        table.rows[i].cells[3].innerText=timeStr;
        msg.innerText="⏰ Time Out Recorded";
        beep(900,150);
        saveAttendance();
        unlock(); return;
      }
    }
  }

  if(mode==="in"){
    let status=getStatus(now);
    let row=table.insertRow();
    row.insertCell(0).innerText=name;
    row.insertCell(1).innerText=dateStr;
    row.insertCell(2).innerText=timeStr;
    row.insertCell(3).innerText="";
    row.insertCell(4).innerText=status;
    row.cells[4].className=status.toLowerCase();
    msg.innerText="✅ Time In Success ("+status+")";
    beep(900,150);
    saveAttendance();
  } else {
    msg.innerText="⚠ Must Time In first";
    beep(300,200);
  }
  unlock();
}

function unlock(){
  setTimeout(()=>scanLocked=false,scanDelay);
}

/* =======================
   OTHER FUNCTIONS
======================= */
function markAllAbsent(){
  let table=document.getElementById("attendanceTable");
  let scanned=[...table.rows].slice(1).map(r=>r.cells[0].innerText);
  let now=new Date().toLocaleDateString();
  for(let id in students){
    let name=students[id].name;
    if(!scanned.includes(name)){
      let r=table.insertRow();
      r.insertCell(0).innerText=name;
      r.insertCell(1).innerText=now;
      r.insertCell(2).innerText="";
      r.insertCell(3).innerText="";
      r.insertCell(4).innerText="Absent";
      r.cells[4].className="absent";
    }
  }
  saveAttendance();
}

function exportToCSV(){
  let rows=[...document.querySelectorAll("#attendanceTable tr")];
  let csv=rows.map(r=>[...r.cells].map(c=>c.innerText).join(",")).join("\n");
  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Attendance.csv";
  a.click();
}

function logout(){
  if(confirm("Logout?")) window.location="index.html";
}

/* =======================
   INIT
======================= */
loadAttendance();
new Html5QrcodeScanner("reader",{fps:10,qrbox:250}).render(onScanSuccess);
</script>

<h4> <a href="https://quickchart.io/qr-code-api/">For new students create your QR code here.</h4>

</body>
</html>
